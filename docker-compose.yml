name: nerostr

services:
  nerostr:
    image: pluja/nerostr:${NEROSTR_VERSION:-2}
    build: .
    container_name: nerostr
    restart: unless-stopped
    env_file: .env
    environment:
      MONERO_WALLET_RPC_URL: http://monero-wallet-rpc:18083/json_rpc
      MONERO_WALLET_RPC_USER: nerostr
    volumes:
      - ./data/nerostr:/data
    ports:
      # Localhost only: put a TLS reverse proxy (Caddy, nginx) in front.
      - "127.0.0.1:8080:8080"
    networks: [web, wallet]
    depends_on: [monero-wallet-rpc]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/nerostr", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  monero-wallet-rpc:
    image: pluja/nerostr-wallet-rpc:${MONERO_VERSION:-v0.18.5.4}
    build: ./wallet-rpc
    container_name: nerostr-monero-wallet-rpc
    restart: unless-stopped
    command:
      - --wallet-file=/wallet/${MONERO_WALLET_FILENAME:?missing in .env}
      - --password-file=/wallet/password
      - --rpc-login=nerostr:${MONERO_WALLET_RPC_PASSWORD:?missing in .env}
      - --daemon-address=${MONERO_DAEMON_ADDRESS:?missing in .env}
      - --untrusted-daemon
      - --log-file=/wallet/monero-wallet-rpc.log
      - --max-log-file-size=10000000
      - --max-log-files=2
    volumes:
      - ./data/wallet:/wallet
    networks: [wallet, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  web:
  # Only nerostr reaches the wallet; the wallet uses egress for its daemon.
  wallet:
    internal: true
  egress:
