<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="A nostr relay paid with Monero. Free to read, one-time payment of {{.Amount}} XMR to publish.">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="Free to read. Pay once with Monero to publish. No spam.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/static/nerostr.webp" type="image/webp">
  <link rel="stylesheet" href="/static/style.css?v={{.Version}}">
  <script src="/static/app.js?v={{.Version}}" defer></script>
  {{- if .Refresh}}
  <noscript><meta http-equiv="refresh" content="30"></noscript>
  {{- end}}
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/static/xmrlogo.webp" alt="" width="72" height="72">
      <h1>{{.Name}}</h1>
    </a>
    <p class="tagline">Free to read. Pay once with Monero to publish. No spam.</p>
    <div class="relay-url">
      <code id="relay-url">{{.RelayURL}}</code>
      <button type="button" class="copy" data-copy="{{.RelayURL}}" aria-label="Copy relay URL">copy</button>
    </div>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer>
    <a href="https://github.com/pluja/nerostr">nerostr</a> {{.Version}} · open source · powered by <a href="https://khatru.nostr.technology/">khatru</a> and <a href="https://www.getmonero.org/">Monero</a>
  </footer>
</body>
</html>
